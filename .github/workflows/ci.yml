name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  RUFF_VERSION: "0.6.9"
  SPACY_MODEL_WHEEL: "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.7.0/es_core_news_md-3.7.0-py3-none-any.whl"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==${{ env.RUFF_VERSION }}"
      - name: ruff check + format check (all services)
        run: |
          for svc in nlp-agent pii-filter mock-core-banking; do
            echo "::group::$svc"
            ruff check "services/$svc"
            ruff format --check "services/$svc"
            echo "::endgroup::"
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [nlp-agent, pii-filter, mock-core-banking]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements-dev.txt
      - name: Install spaCy model (pii-filter only)
        if: matrix.service == 'pii-filter'
        run: pip install "${{ env.SPACY_MODEL_WHEEL }}"
      - name: pytest
        working-directory: services/${{ matrix.service }}
        run: pytest

  build-and-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [nlp-agent, pii-filter, mock-core-banking]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnibank-${{ matrix.service }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          # Build on every PR to prove the Dockerfile works; push only from main.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  bump-image-tag:
    # Closes the GitOps loop: write the freshly-built image tag into the chart so
    # ArgoCD (the deploy source of truth) sees a manifest diff and auto-syncs.
    # Main only — PRs build images but never touch the deployed tag.
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serialize bumps so two near-simultaneous pushes don't race on the same line.
      group: bump-image-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Pin global.imageTag to this commit's short SHA
        run: |
          SHA="${GITHUB_SHA::7}"   # matches docker/metadata-action type=sha,format=short
          sed -i -E "s/^(  imageTag:).*/\1 ${SHA}/" infra/helm/omnibank/values-prod.yaml
          if git diff --quiet infra/helm/omnibank/values-prod.yaml; then
            echo "imageTag already ${SHA} — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm/omnibank/values-prod.yaml
          git commit -m "ci: pin omnibank imageTag to ${SHA} [skip ci]"
          # Rebase in case main advanced while the build ran, then push back.
          git pull --rebase origin main
          git push origin HEAD:main
