# EKS. Images come from ghcr.io.
# global.imageTag is MANAGED BY CI: the `bump-image-tag` job in .github/workflows/ci.yml
# rewrites it to the freshly-built short SHA on every push to main, and ArgoCD (the deploy
# source of truth) auto-syncs the diff. Don't hand-edit it — it will be overwritten.
# `latest` is just the bootstrap value before the first CI run.
# Break-glass manual deploy still works: make deploy-eks (--set global.imageTag=$SHA).
global:
  imageTag: latest

nlp-agent:
  image:
    repository: ghcr.io/norelyj/omnibank-nlp-agent
    pullPolicy: IfNotPresent
  # serviceAccount.roleArn is injected at deploy time by `make deploy-eks`
  # (--set nlp-agent.serviceAccount.roleArn=$(terraform output ...)).
  serviceMonitor:
    enabled: true
  # REDIS_URL is overridden at deploy time with the ElastiCache endpoint.

pii-filter:
  image:
    repository: ghcr.io/norelyj/omnibank-pii-filter
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: true

mock-core-banking:
  image:
    repository: ghcr.io/norelyj/omnibank-mock-core-banking
    pullPolicy: IfNotPresent
  serviceMonitor:
    enabled: true

# EKS uses ElastiCache for Redis — no in-cluster Redis pod.
redis:
  enabled: false
