{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The service's own restricted upstream (Kong for the agent, nlp-agent for the
    # backend services).
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressFromLabel | nindent 14 }}
      ports:
        {{- range .Values.service.ports }}
        - port: {{ .targetPort }}
        {{- end }}
    # Prometheus scraping /metrics from the monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        {{- range .Values.service.ports }}
        - port: {{ .targetPort }}
        {{- end }}
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # In-namespace services: pii-filter, mock-core-banking, Redis.
    - to:
        - podSelector: {}
    # External HTTPS (egress).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
{{- end }}
