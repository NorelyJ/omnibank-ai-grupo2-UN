image:
  repository: ghcr.io/norelyj/omnibank-pii-filter
  tag: latest
  pullPolicy: IfNotPresent

# Single pod — the PRD keeps pii-filter at one replica for the MVP.
replicaCount: 1

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8002
      targetPort: 8002
    - name: grpc
      port: 50051
      targetPort: 50051

# Higher memory than the default — the spaCy es_core_news_md model is held in RAM.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

config:
  ENV: production

hpa:
  enabled: false

networkPolicy:
  enabled: true
  # pii-filter accepts ingress only from the agent.
  ingressFromLabel:
    app: nlp-agent

serviceMonitor:
  enabled: true
