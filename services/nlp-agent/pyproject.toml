[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/pii_pb2.py", "app/pii_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
